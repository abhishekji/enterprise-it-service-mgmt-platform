name: itsm

x-service: &service
  build:
    context: .
    dockerfile: Dockerfile.service
  restart: unless-stopped
  environment: &service-env
    JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    KAFKA_BROKERS: kafka:9092
    REDIS_URL: redis://redis:6379
  depends_on:
    kafka:
      condition: service_healthy
    redis:
      condition: service_started

services:
  # ---------- Infrastructure ----------
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # ---------- One MongoDB per microservice ----------
  mongo-auth:
    image: mongo:7
    ports: ["27022:27017"]
    volumes: [mongo-auth-data:/data/db]
  mongo-incident:
    image: mongo:7
    ports: ["27018:27017"]
    volumes: [mongo-incident-data:/data/db]
  mongo-request:
    image: mongo:7
    ports: ["27019:27017"]
    volumes: [mongo-request-data:/data/db]
  mongo-asset:
    image: mongo:7
    ports: ["27020:27017"]
    volumes: [mongo-asset-data:/data/db]
  mongo-workflow:
    image: mongo:7
    ports: ["27021:27017"]
    volumes: [mongo-workflow-data:/data/db]

  # ---------- Microservices ----------
  api-gateway:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: api-gateway }
    ports: ["4000:4000"]
    environment:
      <<: *service-env
      PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4001
      INCIDENT_SERVICE_URL: http://incident-service:4002
      REQUEST_SERVICE_URL: http://request-service:4003
      ASSET_SERVICE_URL: http://asset-service:4004
      WORKFLOW_SERVICE_URL: http://workflow-service:4005
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

  auth-service:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: auth-service }
    environment:
      <<: *service-env
      PORT: 4001
      MONGO_URI: mongodb://mongo-auth:27017/itsm_auth
    depends_on:
      mongo-auth: { condition: service_started }
      kafka: { condition: service_healthy }
      redis: { condition: service_started }

  incident-service:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: incident-service }
    environment:
      <<: *service-env
      PORT: 4002
      MONGO_URI: mongodb://mongo-incident:27017/itsm_incident
    depends_on:
      mongo-incident: { condition: service_started }
      kafka: { condition: service_healthy }
      redis: { condition: service_started }

  request-service:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: request-service }
    environment:
      <<: *service-env
      PORT: 4003
      MONGO_URI: mongodb://mongo-request:27017/itsm_request
    depends_on:
      mongo-request: { condition: service_started }
      kafka: { condition: service_healthy }
      redis: { condition: service_started }

  asset-service:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: asset-service }
    environment:
      <<: *service-env
      PORT: 4004
      MONGO_URI: mongodb://mongo-asset:27017/itsm_asset
    depends_on:
      mongo-asset: { condition: service_started }
      kafka: { condition: service_healthy }
      redis: { condition: service_started }

  workflow-service:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: workflow-service }
    environment:
      <<: *service-env
      PORT: 4005
      MONGO_URI: mongodb://mongo-workflow:27017/itsm_workflow
    depends_on:
      mongo-workflow: { condition: service_started }
      kafka: { condition: service_healthy }
      redis: { condition: service_started }

  # ---------- Frontends (shell + micro frontends) ----------
  shell:
    build:
      context: .
      dockerfile: Dockerfile.web
      args: { APP: shell }
    ports: ["3000:80"]
    depends_on: [api-gateway]
  mfe-incidents:
    build:
      context: .
      dockerfile: Dockerfile.web
      args: { APP: mfe-incidents }
    ports: ["3001:80"]
  mfe-requests:
    build:
      context: .
      dockerfile: Dockerfile.web
      args: { APP: mfe-requests }
    ports: ["3002:80"]
  mfe-assets:
    build:
      context: .
      dockerfile: Dockerfile.web
      args: { APP: mfe-assets }
    ports: ["3003:80"]

volumes:
  kafka-data:
  redis-data:
  mongo-auth-data:
  mongo-incident-data:
  mongo-request-data:
  mongo-asset-data:
  mongo-workflow-data:
